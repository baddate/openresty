name: Build OpenResty with GeoIP2

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      panel_openresty_version:
        description: "1panel/openresty base image tag (e.g. 1.27.1.2)"
        required: true
        default: "1.27.1.2"
      push_image:
        description: "Push image to registry"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openresty-geoip2
  DEFAULT_PANEL_VERSION: "1.27.1.2-5-1-focal"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build args
        id: args
        run: |
          PANEL_VER="${{ inputs.panel_openresty_version || env.DEFAULT_PANEL_VERSION }}"
          echo "panel_version=${PANEL_VER}" >> $GITHUB_OUTPUT
          echo "Using 1panel/openresty:${PANEL_VER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.push_image)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.args.outputs.panel_version }}

      # build-push-action 不能同时 load 到本地 daemon 又 push 多平台，
      # 所以拆成两步：先 load 本地做冒烟测试，再 push 到 registry。
      - name: Build (load to local daemon for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: ./build
          platforms: linux/amd64
          # load=true 把镜像加载进本地 docker daemon，不推送
          load: true
          tags: openresty-geoip2:smoke
          build-args: |
            PANEL_OPENRESTY_VERSION=${{ steps.args.outputs.panel_version }}
            RESTY_VERSION=1.27.1.2
            RESTY_J=2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 冒烟测试：直接用本地刚 build 好的镜像，不需要 pull，不存在权限问题
      - name: Smoke test - verify GeoIP2 module
        run: |
          docker run --rm openresty-geoip2:smoke openresty -V 2>&1 | tee /tmp/openresty-v.txt
          grep -q "ngx_http_geoip2_module" /tmp/openresty-v.txt \
            && echo "✅ GeoIP2 module confirmed" \
            || (echo "❌ GeoIP2 module NOT found"; cat /tmp/openresty-v.txt; exit 1)

      # 冒烟测试通过后才推送到 registry
      - name: Push to registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.push_image == true)
        uses: docker/build-push-action@v6
        with:
          context: ./build
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PANEL_OPENRESTY_VERSION=${{ steps.args.outputs.panel_version }}
            RESTY_VERSION=1.27.1.2
            RESTY_J=2
          # 第一次 build 已经写入了 GHA cache，这次直接命中，几乎不重新编译
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| base | 1panel/openresty:${{ steps.args.outputs.panel_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OpenResty | 1.27.1.2 |" >> $GITHUB_STEP_SUMMARY
          echo "| RESTY_J | 2 |" >> $GITHUB_STEP_SUMMARY
          echo "| GeoIP2 | ✅ enabled via module.json |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | ${{ steps.meta.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY
